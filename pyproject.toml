# ---------------------------------------------------------------------------
# pyproject.toml — EMODPS_Reservoir_Optimization
#   Run `uv sync` to create .venv and install everything listed here.
#   Add/remove packages as needed with `uv add <pkg>` / `uv remove <pkg>`.
# ---------------------------------------------------------------------------

[project]
name = "emodps-reservoir-optimization"
version = "0.1.0"
description = "Joint design + operating-policy optimization for a multi-purpose reservoir (hydropower, irrigation, dam safety) via monthly mass-balance simulation and NSGA-II, following the EMODPS approach."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pymoo>=0.6",
    "matplotlib>=3.9",
]

# Notes:
# - Add project-specific extras as needed, e.g.:
#     "tqdm>=4.66",        # progress bars for long optimization runs

[tool.uv]
# This is a scripts project (Module/), not an installable library —
# skip building/installing it as a package. Without this, `uv sync`/
# `uv add` fail with a hatchling "no file selection defined" error,
# since there's no actual package for it to build a wheel from.
package = false